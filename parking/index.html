<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking - Maison Notle 303</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/cute-pack.css">
<style>
:root{--accent:#d7bd55;--accent-dark:#a8872e;--accent-light:#f7df7c;--cream:#fff8e8;--text-dark:#4a3b16;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--text-dark);min-height:100vh;}
.top-bar{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);padding:16px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,0.15);}
.back-btn{background:rgba(255,255,255,0.25);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;color:#fff;text-decoration:none;flex-shrink:0;transition:background 0.2s;}
.back-btn:hover{background:rgba(255,255,255,0.4);}
.top-title{font-family:'Pacifico',cursive;font-size:1.3rem;color:#fff;text-shadow:1px 2px 4px rgba(0,0,0,0.2);flex:1;}
.top-emoji{font-size:1.8rem;}
.content{padding:18px 14px 40px;max-width:720px;margin:0 auto;}
.guide-stack{display:flex;flex-direction:column;gap:20px;}
.guide-card{background:#fff;border-radius:18px;padding:10px;box-shadow:0 8px 24px rgba(92,64,12,0.12);}
.guide-image{width:100%;display:block;border-radius:12px;}
.back-footer{text-align:center;margin-top:28px;padding-bottom:20px;}
.back-footer a{display:inline-flex;align-items:center;gap:8px;color:#111;font-weight:700;font-size:1rem;text-decoration:none;background:var(--accent-light);padding:12px 24px;border-radius:50px;transition:opacity 0.2s;}
.back-footer a:hover{opacity:0.8;}
</style>
</head>
<body>
<div class="top-bar">
  <a class="back-btn" href="../">&larr;</a>
  <div class="top-title">Parking</div>
  <div class="top-emoji">📘</div>
</div>
<main class="content">
  <section class="guide-stack">
    <figure class="guide-card"><img src="./assets/parking-guide.jpg" alt="Parking page 1" class="guide-image"></figure>
  </section>
  <div class="back-footer"><a href="../">&larr; Back to Menu</a></div>
</main>
</body>
</html>
