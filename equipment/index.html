<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment - Maison Notle 303</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/cute-pack.css">
<style>
:root{--accent:#d7bd55;--accent-dark:#a8872e;--accent-light:#f7df7c;--cream:#fff8e8;--text-dark:#4a3b16;--text-mid:#745f28;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--text-dark);min-height:100vh;}
.lang-bar{display:flex;justify-content:center;gap:6px;padding:10px 16px;flex-wrap:wrap;background:var(--cream);}
.lang-btn{border:2px solid var(--accent-light);background:rgba(255,255,255,0.92);border-radius:50px;padding:4px 9px;font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:800;color:var(--text-mid);cursor:pointer;transition:all .2s;}
.lang-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.top-bar{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);padding:16px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.15);}
.back-btn{background:rgba(255,255,255,.25);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;color:#fff;text-decoration:none;flex-shrink:0;transition:background .2s;}
.back-btn:hover{background:rgba(255,255,255,.4);}
.top-title{font-family:'Pacifico',cursive;font-size:1.3rem;color:#fff;text-shadow:1px 2px 4px rgba(0,0,0,.2);flex:1;}
.top-emoji{font-size:1.8rem;}
.content{padding:20px 16px 40px;max-width:720px;margin:0 auto;}
.equipment-item{margin:0 0 24px;}
.equipment-photo{width:100%;display:block;border-radius:14px;box-shadow:0 8px 24px rgba(92,64,12,.12);}
.info-card{background:#fff;border-radius:14px;padding:16px 18px;margin-top:12px;box-shadow:0 2px 12px rgba(120,50,80,.08);}
.info-card h3{font-size:1rem;font-weight:900;color:var(--accent-dark);margin-bottom:8px;}
.info-card p{font-size:.95rem;line-height:1.7;color:var(--text-mid);}
.back-footer{text-align:center;margin-top:28px;padding-bottom:20px;}
.back-footer a{display:inline-flex;align-items:center;gap:8px;color:#111;font-weight:700;font-size:1rem;text-decoration:none;background:var(--accent-light);padding:12px 24px;border-radius:50px;transition:opacity .2s;}
.back-footer a:hover{opacity:.8;}
</style>
</head>
<body>
<div class="lang-bar">
  <button class="lang-btn active" data-lang="en">EN</button>
  <button class="lang-btn" data-lang="ja">JA</button>
  <button class="lang-btn" data-lang="zh">ZH</button>
  <button class="lang-btn" data-lang="ko">KO</button>
  <button class="lang-btn" data-lang="fr">FR</button>
  <button class="lang-btn" data-lang="es">ES</button>
</div>
<div class="top-bar">
  <a class="back-btn" href="../">&larr;</a>
  <div class="top-title">Equipment</div>
  <div class="top-emoji">📘</div>
</div>
<main class="content">
  <div id="equipment-list"></div>
  <div class="back-footer"><a id="back-link" href="../">&larr; Back to Menu</a></div>
</main>
<script>
const STRINGS = {
  en: { back: '&larr; Back to Menu' },
  ja: { back: '&larr; メニューへ戻る' },
  zh: { back: '&larr; 返回菜单' },
  ko: { back: '&larr; 메뉴로 돌아가기' },
  fr: { back: '&larr; Retour au menu' },
  es: { back: '&larr; Volver al menu' }
};
const SECTIONS = [{"image": "./assets/pdf-pages/page-1.jpg", "title": {"en": "Air Conditioner", "ja": "エアコン", "zh": "空调", "ko": "에어컨", "fr": "Climatiseur", "es": "Aire acondicionado"}, "body": {"en": "Press COOL or HEAT to turn the air conditioner on. Use the upper and lower temperature buttons to adjust the setting, AIR VOLUME to change the fan speed, and OFF to stop it.", "ja": "冷房または暖房を押してエアコンを起動します。上下の温度ボタンで温度、AIR VOLUMEで風量を調整し、OFFで停止してください。", "zh": "按 COOL 或 HEAT 启动空调。用上下温度键调节温度，用 AIR VOLUME 调节风量，按 OFF 关闭。", "ko": "COOL 또는 HEAT 버튼으로 에어컨을 켜세요. 위아래 온도 버튼으로 온도를, AIR VOLUME으로 풍량을 조절하고 OFF로 끄면 됩니다.", "fr": "Appuyez sur COOL ou HEAT pour allumer la climatisation. Utilisez les boutons de temperature pour regler la temperature, AIR VOLUME pour la ventilation, puis OFF pour l arreter.", "es": "Pulse COOL o HEAT para encender el aire acondicionado. Use los botones de temperatura para ajustar la temperatura, AIR VOLUME para el caudal y OFF para apagarlo."}}, {"image": "./assets/pdf-pages/page-2.jpg", "title": {"en": "Lighting Remote", "ja": "照明リモコン", "zh": "灯光遥控器", "ko": "조명 리모컨", "fr": "Telecommande d eclairage", "es": "Mando de iluminacion"}, "body": {"en": "Use ON and OFF to control the light, and Bright or Dim to adjust the brightness.", "ja": "ONとOFFで照明を操作し、BrightとDimで明るさを調整します。", "zh": "使用 ON 和 OFF 控制灯光，用 Bright 和 Dim 调节亮度。", "ko": "ON과 OFF로 조명을 켜고 끄며 Bright와 Dim으로 밝기를 조절할 수 있습니다.", "fr": "Utilisez ON et OFF pour la lumiere, puis Bright ou Dim pour regler la luminosite.", "es": "Use ON y OFF para controlar la luz, y Bright o Dim para ajustar el brillo."}}, {"image": "./assets/pdf-pages/page-3.jpg", "title": {"en": "TV", "ja": "テレビ", "zh": "电视", "ko": "TV", "fr": "Television", "es": "Television"}, "body": {"en": "Use the smart TV remote for power, volume, and the home menu.", "ja": "スマートテレビのリモコンで電源、音量、ホームメニューを操作できます。", "zh": "使用智能电视遥控器控制电源、音量和主菜单。", "ko": "스마트 TV 리모컨으로 전원, 음량, 홈 메뉴를 조작할 수 있습니다.", "fr": "Utilisez la telecommande de la Smart TV pour l alimentation, le volume et le menu principal.", "es": "Use el mando del Smart TV para el encendido, el volumen y el menu principal."}}, {"image": "./assets/pdf-pages/page-4.jpg", "title": {"en": "Washing Machine", "ja": "洗濯機", "zh": "洗衣机", "ko": "세탁기", "fr": "Machine a laver", "es": "Lavadora"}, "body": {"en": "Add liquid detergent in the detergent compartment and fabric softener in the softener compartment. Turn the machine on, choose the course, and press START/PAUSE to begin.", "ja": "洗剤投入口に液体洗剤、柔軟剤投入口に柔軟剤を入れてください。電源を入れ、コースを選び、START/PAUSEで洗濯を始めます。", "zh": "将液体洗涤剂加入洗剂格，将柔顺剂加入柔顺剂格。打开电源，选择程序后按 START/PAUSE 开始洗衣。", "ko": "세제 칸에 액체 세제를, 유연제 칸에 섬유유연제를 넣어 주세요. 전원을 켜고 코스를 선택한 뒤 START/PAUSE를 누르면 시작됩니다.", "fr": "Ajoutez la lessive liquide dans le compartiment detergent et l assouplissant dans le compartiment reserve. Allumez la machine, choisissez le programme puis appuyez sur START/PAUSE.", "es": "Ponga el detergente liquido en el compartimento del detergente y el suavizante en su compartimento. Encienda la maquina, elija el programa y pulse START/PAUSE."}}, {"image": "./assets/pdf-pages/page-5.jpg", "title": {"en": "Clothes Dryer", "ja": "乾燥機", "zh": "烘干机", "ko": "건조기", "fr": "Seche-linge", "es": "Secadora"}, "body": {"en": "Turn the dryer on, select the course, and press START/PAUSE. Remove your clothes when drying is finished.", "ja": "乾燥機の電源を入れ、コースを選んでSTART/PAUSEを押してください。乾燥が終わったら衣類を取り出します。", "zh": "打开烘干机，选择程序后按 START/PAUSE。烘干结束后取出衣物。", "ko": "건조기 전원을 켜고 코스를 선택한 다음 START/PAUSE를 눌러 주세요. 건조가 끝나면 옷을 꺼내면 됩니다.", "fr": "Allumez le seche-linge, choisissez le programme puis appuyez sur START/PAUSE. Retirez le linge une fois le sechage termine.", "es": "Encienda la secadora, seleccione el programa y pulse START/PAUSE. Saque la ropa cuando termine el secado."}}, {"image": "./assets/pdf-pages/page-6.jpg", "title": {"en": "Water Heater", "ja": "給湯器", "zh": "热水器", "ko": "온수기", "fr": "Chauffe-eau", "es": "Calentador de agua"}, "body": {"en": "Press ON/OFF before using hot water. Use the upper and lower buttons if you need to change the temperature.", "ja": "お湯を使う前にON/OFFを押してください。温度を変えたいときは上下ボタンで調整します。", "zh": "使用热水前请先按 ON/OFF。如需调节温度，请使用上下按钮。", "ko": "온수를 사용하기 전에 ON/OFF를 눌러 주세요. 온도를 바꾸려면 위아래 버튼을 사용하면 됩니다.", "fr": "Appuyez sur ON/OFF avant d utiliser l eau chaude. Utilisez les boutons haut et bas pour changer la temperature si besoin.", "es": "Pulse ON/OFF antes de usar el agua caliente. Si necesita cambiar la temperatura, use los botones superior e inferior."}}, {"image": "./assets/pdf-pages/page-7.jpg", "title": {"en": "Microwave", "ja": "電子レンジ", "zh": "微波炉", "ko": "전자레인지", "fr": "Micro-ondes", "es": "Microondas"}, "body": {"en": "Open the microwave door and place the food inside. Press START to begin heating, and remove the food carefully when it is finished.", "ja": "ドアを開けて食品を入れ、STARTを押して加熱します。終了後はやけどに注意して取り出してください。", "zh": "打开微波炉门放入食物，按 START 开始加热，结束后请小心取出。", "ko": "문을 열고 음식을 넣은 뒤 START를 눌러 가열하세요. 완료 후에는 뜨거우니 조심해서 꺼내 주세요.", "fr": "Ouvrez la porte du micro-ondes et placez les aliments a l interieur. Appuyez sur START pour chauffer, puis retirez-les avec precaution a la fin.", "es": "Abra la puerta del microondas y coloque la comida dentro. Pulse START para comenzar a calentar y retire la comida con cuidado al terminar."}}, {"image": "./assets/pdf-pages/page-8.jpg", "title": {"en": "Toaster Oven", "ja": "オーブントースター", "zh": "烤面包机", "ko": "토스터 오븐", "fr": "Mini four grille-pain", "es": "Horno tostador"}, "body": {"en": "Place the food inside and set the timer. The toaster oven starts automatically.", "ja": "食べ物を入れてタイマーを設定すると、自動で加熱が始まります。", "zh": "放入食物并设定定时器后，烤箱会自动开始加热。", "ko": "음식을 넣고 타이머를 맞추면 자동으로 작동합니다.", "fr": "Placez les aliments a l interieur et reglez le minuteur. Le mini four demarre automatiquement.", "es": "Coloque la comida dentro y ajuste el temporizador. El horno tostador empezara automaticamente."}}, {"image": "./assets/pdf-pages/page-9.jpg", "title": {"en": "Gas Stove", "ja": "ガスコンロ", "zh": "燃气灶", "ko": "가스레인지", "fr": "Cuisiniere a gaz", "es": "Cocina de gas"}, "body": {"en": "Turn the knob to ignite, adjust the flame with the same knob, and turn it fully off after use.", "ja": "つまみを回して点火し、同じつまみで火力を調整します。使用後はしっかり消してください。", "zh": "转动旋钮点火，并用同一个旋钮调节火力。使用后请完全关闭。", "ko": "손잡이를 돌려 점화하고 같은 손잡이로 화력을 조절합니다. 사용 후에는 완전히 꺼 주세요.", "fr": "Tournez le bouton pour allumer, reglez la flamme avec ce meme bouton, puis fermez-le completement apres usage.", "es": "Gire la perilla para encender, ajuste la llama con la misma perilla y apaguela por completo despues de usarla."}}];
let currentLang = 'en';
function renderSections() {
  const list = document.getElementById('equipment-list');
  list.innerHTML = SECTIONS.map((section) => `
    <section class="equipment-item">
      <img src="${section.image}" alt="${section.title.en}" class="equipment-photo">
      <div class="info-card">
        <h3>${section.title[currentLang]}</h3>
        <p>${section.body[currentLang]}</p>
      </div>
    </section>
  `).join('');
  document.getElementById('back-link').innerHTML = STRINGS[currentLang].back;
}
document.querySelectorAll('.lang-btn').forEach((button) => {
  button.addEventListener('click', () => {
    currentLang = button.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach((btn) => btn.classList.toggle('active', btn === button));
    renderSections();
  });
});
renderSections();
</script>
</body>
</html>
